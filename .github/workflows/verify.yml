name: Verify

# No push trigger for main: the no-bypass ruleset means every main commit
# arrives through a pull request whose required checks ran on the identical
# tree, so a branch-push run would verify the same tree a second time. Tags
# still run everything plus the release gate.
on:
  push:
    tags:
      - v*
  pull_request:

permissions:
  contents: read

jobs:
  contracts:
    name: Contracts (${{ matrix.os }}, Node ${{ matrix.node }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: 22
          - os: macos-latest
            node: 24
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
      - name: Verify release and contracts
        run: node templates/tools/verify.mjs --plugin-root .
      - name: Verify release tag
        if: runner.os == 'Linux' && startsWith(github.ref, 'refs/tags/v')
        run: >-
          node templates/tools/release-verify.mjs
          --release-mode
          --check-root .
          --repository "$GITHUB_REPOSITORY"
          --tag "$GITHUB_REF_NAME"
          --main-ref refs/remotes/origin/main
      - name: Check committed whitespace
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if test -n "$BASE_SHA" &&
             test "$BASE_SHA" != "0000000000000000000000000000000000000000" &&
             git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null
          then
            git diff --check "$BASE_SHA" HEAD
          else
            git diff-tree --root --no-commit-id --check HEAD
          fi
