<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="770" viewBox="0 0 1200 770" role="img" aria-labelledby="title desc">
  <title id="title">Autoloop's eleven-step forward path</title>
  <desc id="desc">A maintainer-approved issue moves through eleven numbered steps: premise, plan, plan review, claim, implement, simplify, diff review, code review and fixes, gate, publish, and record. The result is a ready pull request with exact-head evidence. Reconcile may run before step one but is outside the eleven-step unit.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0L9 4.5L0 9Z" fill="#64748b"/>
    </marker>
    <style>
      .bg { fill: #ffffff; }
      .card { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.5; }
      .outcome { fill: #fffbeb; stroke: #f59e0b; stroke-width: 1.5; }
      .note-card { fill: #f8fafc; stroke: #e2e8f0; stroke-width: 1; }
      .heading { fill: #0f172a; font: 750 25px Inter, ui-sans-serif, system-ui, sans-serif; }
      .subtitle { fill: #475569; font: 450 14px Inter, ui-sans-serif, system-ui, sans-serif; }
      .step { font: 750 13px Inter, ui-sans-serif, system-ui, sans-serif; letter-spacing: 0.45px; }
      .card-title { fill: #0f172a; font: 700 18px Inter, ui-sans-serif, system-ui, sans-serif; }
      .copy { fill: #475569; font: 450 13px Inter, ui-sans-serif, system-ui, sans-serif; }
      .note-title { fill: #334155; font: 700 12px Inter, ui-sans-serif, system-ui, sans-serif; }
      .note { fill: #475569; font: 450 12px Inter, ui-sans-serif, system-ui, sans-serif; }
      .flow { fill: none; stroke: #64748b; stroke-width: 2.25; marker-end: url(#arrow); }
      @media (prefers-color-scheme: dark) {
        .bg { fill: #0d1117; }
        .card, .note-card { fill: #161b22; stroke: #30363d; }
        .outcome { fill: #272115; stroke: #d29922; }
        .heading, .card-title { fill: #f0f6fc; }
        .subtitle, .copy, .note { fill: #b1bac4; }
        .note-title { fill: #d0d7de; }
      }
    </style>
  </defs>

  <rect class="bg" width="1200" height="770"/>
  <text x="30" y="37" class="heading">ONE APPROVED ISSUE → ONE READY PR</text>
  <text x="30" y="65" class="subtitle">Eleven numbered steps. Every step announces one ribbon, including no-ops.</text>
  <rect x="820" y="24" width="350" height="54" rx="8" class="note-card"/>
  <text x="838" y="46" class="note-title">PRE-UNIT · 00 RECONCILE</text>
  <text x="838" y="65" class="note">May adopt an orphan before 01; not a twelfth step.</text>

  <path class="flow" d="M290 190H320"/>
  <path class="flow" d="M580 190H610"/>
  <path class="flow" d="M870 190H900"/>
  <path class="flow" d="M1030 260V310"/>
  <path class="flow" d="M900 380H870"/>
  <path class="flow" d="M610 380H580"/>
  <path class="flow" d="M320 380H290"/>
  <path class="flow" d="M160 450V500"/>
  <path class="flow" d="M290 570H320"/>
  <path class="flow" d="M580 570H610"/>
  <path class="flow" d="M870 570H900"/>

  <g transform="translate(30 120)">
    <rect class="card" width="260" height="140" rx="9"/>
    <rect width="260" height="5" rx="2.5" fill="#0891b2"/>
    <text x="16" y="29" class="step" fill="#0e7490">01 PREMISE</text>
    <text x="16" y="59" class="card-title">Orchestrator</text>
    <text x="16" y="88" class="copy">Select eligible work.</text>
    <text x="16" y="110" class="copy">Verify trust and premises.</text>
  </g>

  <g transform="translate(320 120)">
    <rect class="card" width="260" height="140" rx="9"/>
    <rect width="260" height="5" rx="2.5" fill="#7c3aed"/>
    <text x="16" y="29" class="step" fill="#6d28d9">02 PLAN</text>
    <text x="16" y="59" class="card-title">Fresh planner</text>
    <text x="16" y="88" class="copy">Define one boundary,</text>
    <text x="16" y="110" class="copy">invariants, and tests.</text>
  </g>

  <g transform="translate(610 120)">
    <rect class="card" width="260" height="140" rx="9"/>
    <rect width="260" height="5" rx="2.5" fill="#7c3aed"/>
    <text x="16" y="29" class="step" fill="#6d28d9">03 PLAN-REVIEW</text>
    <text x="16" y="59" class="card-title">Fresh reviewer</text>
    <text x="16" y="88" class="copy">Challenge the complete plan</text>
    <text x="16" y="110" class="copy">once; disposition findings.</text>
  </g>

  <g transform="translate(900 120)">
    <rect class="card" width="260" height="140" rx="9"/>
    <rect width="260" height="5" rx="2.5" fill="#7c3aed"/>
    <text x="16" y="29" class="step" fill="#6d28d9">04 CLAIM</text>
    <text x="16" y="59" class="card-title">Orchestrator</text>
    <text x="16" y="88" class="copy">Persist intent, freeze plan,</text>
    <text x="16" y="110" class="copy">open the draft PR.</text>
  </g>

  <g transform="translate(900 310)">
    <rect class="card" width="260" height="140" rx="9"/>
    <rect width="260" height="5" rx="2.5" fill="#2563eb"/>
    <text x="16" y="29" class="step" fill="#1d4ed8">05 IMPLEMENT</text>
    <text x="16" y="59" class="card-title">Fresh implementer</text>
    <text x="16" y="88" class="copy">Build test-first;</text>
    <text x="16" y="110" class="copy">commit each plan task.</text>
  </g>

  <g transform="translate(610 310)">
    <rect class="card" width="260" height="140" rx="9"/>
    <rect width="260" height="5" rx="2.5" fill="#2563eb"/>
    <text x="16" y="29" class="step" fill="#1d4ed8">06 SIMPLIFY</text>
    <text x="16" y="59" class="card-title">Fresh simplifier</text>
    <text x="16" y="88" class="copy">Reduce the artifact</text>
    <text x="16" y="110" class="copy">without changing behavior.</text>
  </g>

  <g transform="translate(320 310)">
    <rect class="card" width="260" height="140" rx="9"/>
    <rect width="260" height="5" rx="2.5" fill="#16a34a"/>
    <text x="16" y="29" class="step" fill="#15803d">07 DIFF-REVIEW</text>
    <text x="16" y="59" class="card-title">Orchestrator</text>
    <text x="16" y="88" class="copy">Inspect the simplified diff;</text>
    <text x="16" y="110" class="copy">fix and record defects.</text>
  </g>

  <g transform="translate(30 310)">
    <rect class="card" width="260" height="140" rx="9"/>
    <rect width="260" height="5" rx="2.5" fill="#16a34a"/>
    <text x="16" y="29" class="step" fill="#15803d">08 CODE-REVIEW / FIX</text>
    <text x="16" y="59" class="card-title">Fresh reviewers</text>
    <text x="16" y="88" class="copy">Review full diff, then only</text>
    <text x="16" y="110" class="copy">fix deltas and open rebuts.</text>
  </g>

  <g transform="translate(30 500)">
    <rect class="card" width="260" height="140" rx="9"/>
    <rect width="260" height="5" rx="2.5" fill="#16a34a"/>
    <text x="16" y="29" class="step" fill="#15803d">09 GATE</text>
    <text x="16" y="59" class="card-title">Orchestrator</text>
    <text x="16" y="88" class="copy">Run the full objective gate;</text>
    <text x="16" y="110" class="copy">record the gated OID.</text>
  </g>

  <g transform="translate(320 500)">
    <rect class="card" width="260" height="140" rx="9"/>
    <rect width="260" height="5" rx="2.5" fill="#d97706"/>
    <text x="16" y="29" class="step" fill="#b45309">10 PUBLISH</text>
    <text x="16" y="59" class="card-title">Orchestrator</text>
    <text x="16" y="88" class="copy">Verify and bind the already-</text>
    <text x="16" y="110" class="copy">pushed gated remote head.</text>
  </g>

  <g transform="translate(610 500)">
    <rect class="card" width="260" height="140" rx="9"/>
    <rect width="260" height="5" rx="2.5" fill="#d97706"/>
    <text x="16" y="29" class="step" fill="#b45309">11 RECORD</text>
    <text x="16" y="59" class="card-title">Orchestrator</text>
    <text x="16" y="88" class="copy">Post one durable run record;</text>
    <text x="16" y="110" class="copy">continue or stop clean.</text>
  </g>

  <g transform="translate(900 500)">
    <rect class="outcome" width="260" height="140" rx="9"/>
    <text x="16" y="33" class="step" fill="#b45309">OUTCOME</text>
    <text x="16" y="64" class="card-title">Ready PR</text>
    <text x="16" y="93" class="copy">Exact-head evidence attached.</text>
    <text x="16" y="115" class="copy">Human merges by default.</text>
  </g>

  <g transform="translate(30 672)">
    <rect class="note-card" width="360" height="70" rx="8"/>
    <text x="16" y="25" class="note-title">RIBBONS</text>
    <text x="16" y="47" class="note">10/11 and 11/11 print even without step labels.</text>
  </g>
  <g transform="translate(420 672)">
    <rect class="note-card" width="360" height="70" rx="8"/>
    <text x="16" y="25" class="note-title">GITHUB LABELS</text>
    <text x="16" y="47" class="note">Step 10 swaps loop:09-gate → loop-delivered.</text>
  </g>
  <g transform="translate(810 672)">
    <rect class="note-card" width="360" height="70" rx="8"/>
    <text x="16" y="25" class="note-title">PUSH OWNERSHIP</text>
    <text x="16" y="47" class="note">Park pushes continuously; step 10 verifies/binds.</text>
  </g>
</svg>
